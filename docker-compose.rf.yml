# ─────────────────────────────────────────────────────────────────────────────
# RF-node subset — runs ONLY the services that must egress from a Russian IP.
#   • data-collector  (gRPC :50056)  — НСПД/Росреестр + ЕГРН
#   • market-service  (gRPC :50058)  — torgi.gov.ru
#   • clickhouse                     — market analytics (local to market-service)
#
# Why a separate node: nspd.gov.ru / torgi.gov.ru drop datacenter IPs at the TCP
# level. Even this RF VPS (AS210546) gets no SYN-ACK. Gov traffic is therefore
# tunnelled through a RESIDENTIAL/MOBILE RF proxy via HTTPS_PROXY (see .env.rf).
#
# gRPC ports are bound to 127.0.0.1 only. Cross-host access from Railway is added
# separately via a TLS-terminating + token-checking reverse proxy (nginx/caddy)
# with a firewall allowlist on Railway's static egress IP. Never expose 50056/50058
# raw to the internet — the app speaks insecure gRPC.
#
# Usage on the VPS:
#   docker compose -f docker-compose.rf.yml --env-file .env.rf up -d --build
# ─────────────────────────────────────────────────────────────────────────────
services:

  data-collector:
    build:
      context: .
      dockerfile: services/data-collector/Dockerfile
    env_file: .env.rf
    ports:
      - "127.0.0.1:50056:50056"
    restart: unless-stopped
    networks: [landscore-rf]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; socket.create_connection((\"localhost\", 50056), 2)' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  market-service:
    build:
      context: .
      dockerfile: services/market-service/Dockerfile
    env_file: .env.rf
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:50058:50058"
    restart: unless-stopped
    networks: [landscore-rf]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; socket.create_connection((\"localhost\", 50058), 2)' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    environment:
      CLICKHOUSE_DB: market
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [landscore-rf]

volumes:
  clickhouse_data:

networks:
  landscore-rf:
    driver: bridge
