syntax = "proto3";
package auth;
option py_generic_services = true;

service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc RefreshToken(RefreshRequest) returns (AuthResponse);
  rpc ValidateToken(ValidateRequest) returns (ValidateResponse);
  rpc GetProfile(GetProfileRequest) returns (UserProfile);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserProfile);

  // Admin / RBAC
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUserRole(UpdateUserRoleRequest) returns (AdminUser);
  rpc SetUserActive(SetUserActiveRequest) returns (AdminUser);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc CountUsers(CountUsersRequest) returns (CountUsersResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message ValidateRequest {
  string access_token = 1;
}

message ValidateResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
  string role = 4;
  bool is_active = 5;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  UserProfile profile = 4;
  string role = 5;
  bool is_active = 6;
}

message GetProfileRequest {
  string user_id = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  optional string client_type = 2;
  optional string main_task = 3;
  optional string region = 4;
  repeated string priority = 5;
  optional string risk_tolerance = 6;
  repeated string preferred_scenarios = 7;
  optional string organization = 8;
  optional float budget = 9;
  bool priority_set = 10;
  bool preferred_scenarios_set = 11;
}

message UserProfile {
  string user_id = 1;
  string email = 2;
  string name = 3;
  string client_type = 4;
  string main_task = 5;
  string region = 6;
  repeated string priority = 7;
  string risk_tolerance = 8;
  repeated string preferred_scenarios = 9;
  string organization = 10;
  float budget = 11;
  string created_at = 12;
  string role = 13;
  bool is_active = 14;
}

// ── Admin / RBAC ──────────────────────────────────────

message AdminUser {
  string user_id = 1;
  string email = 2;
  string name = 3;
  string role = 4;
  bool is_active = 5;
  string client_type = 6;
  string region = 7;
  string created_at = 8;
}

message ListUsersRequest {
  int32 limit = 1;
  int32 offset = 2;
  string query = 3;
}

message ListUsersResponse {
  repeated AdminUser users = 1;
  int32 total = 2;
}

message UpdateUserRoleRequest {
  string user_id = 1;
  string role = 2;
}

message SetUserActiveRequest {
  string user_id = 1;
  bool is_active = 2;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message CountUsersRequest {
}

message CountUsersResponse {
  int32 total = 1;
  int32 admins = 2;
  int32 active = 3;
}
